<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos | Clarity Lab</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="header-main">
            <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <a class="logo" href="index.html">
                <img src="assets/images/Mídia.jpeg" alt="Logo">
            </a>

            <div class="busca">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInput" type="search" placeholder="Buscar produtos...">
            </div>

            <div class="header-actions">
                <div class="carrinho">
                    <img src="assets/images/carrinho.png" alt="Carrinho">
                </div>

                <button class="usuario" id="userButton" type="button" aria-label="Configurar conta do usuário">
                    <img src="assets/images/Úsuario.webp" alt="Usuário">
                    <span id="userName">Usuário</span>
                </button>
            </div>
            <div class="Marca-da-agua">
                <img src="assets/images/logo 3.png" alt="Marca da água">
            </div>
        </div>

        <nav class="menu-mobile" id="menu-mobile">
            <a href="index.html">Início</a>
            <a href="BodySplash.html">Body Splashs</a>
            <a href="cremes.html">Cremes</a>
            <a href="sabonetes.html">Sabonetes</a>
            <a href="kits.html">Kits</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="sobre.html">Sobre</a>
        </nav>
    </header>

    <main>
        <section class="category-section">
            <div class="category-card">
                <h1>Favoritos</h1>
            </div>
            <div class="products-grid" id="favorites-list"></div>
        </section>
    </main>

    <script src="assets/js/cart.js"></script>
    <script src="assets/js/search.js"></script>
    <script>
        const toggleButton = document.querySelector('.menu-toggle');
        const mobileMenu = document.querySelector('.menu-mobile');

        if (toggleButton && mobileMenu) {
            toggleButton.addEventListener('click', () => {
                const isOpen = mobileMenu.classList.toggle('open');
                toggleButton.setAttribute('aria-expanded', isOpen);
            });
        }

        const userButton = document.querySelector('#userButton');
        const userName = document.querySelector('#userName');

        function loadUserName() {
            const savedName = localStorage.getItem('userName');
            if (savedName && userName) {
                userName.textContent = savedName;
            }
        }

        if (userButton) {
            userButton.addEventListener('click', () => {
                const currentName = localStorage.getItem('userName') || 'Usuário';
                const newName = prompt('Digite o nome da conta:', currentName);
                if (newName !== null) {
                    const formatted = newName.trim() || 'Usuário';
                    localStorage.setItem('userName', formatted);
                    if (userName) {
                        userName.textContent = formatted;
                    }
                }
            });
        }

        loadUserName();

        const favoritesList = document.getElementById('favorites-list');
        const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        if (favorites.length === 0) {
            favoritesList.innerHTML = '<p class="empty-state">Nenhum produto favoritado ainda.</p>';
        } else {
            favorites.forEach(product => {
                const article = document.createElement('article');
                article.className = 'product-card';
                article.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" />
                    <h2>${product.name}</h2>
                    <p>${product.description}</p>
                `;
                favoritesList.appendChild(article);
            });
        }
    </script>
</body>
</html>
